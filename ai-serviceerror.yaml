apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-ai-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-model
  template:
    metadata:
      labels:
        app: ai-model
    spec:
      containers:
      - name: python-ai
        image: python:3.9-slim
        command: ["sleep", "3600"]
        # КРИТИЧНА ПОМИЛКА: Контейнер має повний доступ до хост-системи (Privileged)
        securityContext:
          privileged: true
          runAsUser: 0
