name: Continuous Security & LLMSecOps Guard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  infrastructure-audit:
    name: Run Checkov & Trivy Static Scanners
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test Cloud Infrastructure (Checkov)
      uses: bridgecrewio/checkov-action@master
      with:
        framework: terraform
        output_format: cli
        soft_fail: true

    - name: Test Kubernetes Configuration (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        format: 'table'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'

  ai-model-dast:
    name: Run Garak AI Security Active Scan
    runs-on: ubuntu-latest
    needs: infrastructure-audit

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Clean Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install NVIDIA Garak Framework
      run: |
        python -m pip install --upgrade pip
        pip install garak

    - name: Execute Active Garak Probes against LLM
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        export OPENAI_API_KEY="${{ secrets.GROQ_API_KEY }}"
        export OPENAI_BASE_URL="https://groq.com"
        python -m garak --target_type openai.Chat --target_name llama3-8b-8192 --probes promptinject

